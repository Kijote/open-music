[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-music"
version = "0.1.0"
description = "Compile linear audio into modular, reproducible sample representations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.12,<1"]

[project.scripts]
open-music-benchmark = "open_music.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
