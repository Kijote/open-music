name: External recording benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  external-cc0-small:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: corpus/cache
          key: open-music-external-${{ hashFiles('corpus/external-small.json') }}
      - run: pip install -e ".[dev]"
      - name: Discover candidates from the external mixed recording
        run: open-music-external-benchmark
      - name: Verify diagnostic baseline
        run: |
          python - <<'PY'
          import json
          report = json.load(open("artifacts/external-benchmark/metrics.json"))
          assert report["corpus"] == "external-cc0-small-v1"
          by_id = {item["recording_id"]: item for item in report["recordings"]}
          assert set(by_id) == {
              "prehistoric-drum-loop", "wip-loop-track-02", "slowdrum-track-02"
          }
          percussion = by_id["prehistoric-drum-loop"]
          assert percussion["event_count"] == 8
          assert percussion["modules"]["module_count"] == 4
          assert percussion["modules"]["reuse_ratio"] == 2.0
          assert percussion["reconstruction"]["explained_energy"] >= 0.998
          for recording in by_id.values():
              assert len(recording["candidate_frames"]) == recording["event_count"]
              residual = recording["residual_discovery"]
              assert residual["stop_reason"] in {
                  "no_onsets", "no_reusable_clusters", "insufficient_improvement",
                  "residual_floor", "maximum_passes"
              }
              assert all(
                  item["energy_after"] <= item["energy_before"]
                  for item in residual["passes"]
              )
          assert by_id["wip-loop-track-02"]["channels"] == 1
          assert by_id["slowdrum-track-02"]["channels"] == 1
          assert report["aggregate"]["recording_count"] == 3
          assert report["aggregate"]["explained_energy"] >= 0.38
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-music-external-benchmark-${{ github.sha }}
          path: artifacts/external-benchmark
          if-no-files-found: error
