name: Open corpus benchmark

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  open-small:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: corpus/cache
          key: open-music-corpus-${{ hashFiles('corpus/open-small.json') }}
      - run: pip install -e ".[dev]"
      - name: Discover, reconstruct and compare open corpus
        run: open-music-benchmark
      - name: Assert discovery benchmark thresholds
        run: |
          python - <<'PY'
          import json
          report = json.load(open("artifacts/benchmark/metrics.json"))
          for track in report["tracks"]:
              assert track["detection"]["precision"] == 1.0
              assert track["detection"]["recall"] == 1.0
              assert track["metrics"]["explained_energy"] >= 0.95
              assert track["modularity"]["reuse_ratio"] >= 4
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-music-benchmark-${{ github.sha }}
          path: artifacts/benchmark
          if-no-files-found: error
